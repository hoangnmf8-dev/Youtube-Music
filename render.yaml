services:
  - type: web
    name: youtube-music-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --no-audit --no-fund
    startCommand: npm run start:render
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: youtube-music-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_DAYS
        value: 30
      - key: CLIENT_ORIGIN
        value: http://localhost:5173

databases:
  - name: youtube-music-db
    plan: free
    region: singapore
    databaseName: youtube_music
    user: youtube_music
    postgresMajorVersion: "16"
